name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: |
          for f in scripts/*.sh doctor/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: ShellCheck (non-blocking style)
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning scripts/*.sh doctor/*.sh || true
